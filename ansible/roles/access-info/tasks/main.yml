---
- name: Get ArgoCD server service information
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: argocd-server
    namespace: "{{ argocd.namespace }}"
  register: argocd_service_info
  
- name: Get Grafana service information
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: ebpf-ai-grafana
    namespace: "{{ applications.ebpf_ai.namespace }}"
  register: grafana_service_info
  ignore_errors: yes
  
- name: Get ML Detector service information
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: ml-detector
    namespace: "{{ applications.ebpf_ai.namespace }}"
  register: ml_detector_service_info
  ignore_errors: yes
  
- name: Display bootstrap completion information
  debug:
    msg:
      - "🎉 eBPF + AI GitOps Bootstrap Complete!"
      - ""
      - "🔧 ArgoCD Access:"
      - "   UI: https://argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
      - "   Port Forward: kubectl port-forward svc/argocd-server -n argocd 8080:80"
      - "   Username: admin"
      - "   Password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
      - ""
      - "⚡ Quick Status:"
      - "   export KUBECONFIG=~/.kube/config-kubeadm"
      - "   kubectl get applications -n argocd"
      - "   kubectl get pods -n ebpf-security"
      - ""
      - "📝 Applications will be automatically deployed by ArgoCD from Git"