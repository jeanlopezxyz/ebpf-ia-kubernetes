---
- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    name: "{{ argocd.namespace }}"
    api_version: v1
    kind: Namespace
    state: present
    
- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
    
- name: Install ArgoCD via official Helm chart
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd.namespace }}"
    update_repo_cache: true
    values:
      global:
        domain: "{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
      argo-cd:
        configs:
          params:
            "server.insecure": "true"
          cm:
            admin.enabled: "true"
            url: "http://argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
        server:
          insecure: true
          service:
            type: "ClusterIP"
            ports:
              - port: 80
                targetPort: 8080
          ingress:
            enabled: true
            className: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "false"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
              nginx.ingress.kubernetes.io/client-body-timeout: "60"
              nginx.ingress.kubernetes.io/client-max-body-size: "1m"
              nginx.ingress.kubernetes.io/proxy-ssl-redirect: "false"
              nginx.ingress.kubernetes.io/proxy-ssl-verify: "false"
              nginx.ingress.kubernetes.io/configuration-snippet: |
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            hosts:
              - host: "argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      name: argocd-server
                      port: 80
                  - path: /
                    pathType: Prefix
                    service:
                      name: argocd-server
                      port: 8443
        repoServer:
          env:
            - name: NO_PROXY
              value: "127.0.0.1,localhost,.svc,.cluster.local,kubernetes.default.svc"
    wait: true
    timeout: 600s
    
- name: Wait for ArgoCD deployments to be ready
  kubernetes.core.k8s:
    kind: Deployment
    api_version: apps/v1
    name: argocd-server
    namespace: "{{ argocd.namespace }}"
    wait: true
    wait_sleep: 5
    wait_timeout: 300
    wait_condition:
      type: Progressing
      status: "True"
      reason: NewReplicaSetAvailable
    
- name: Set ArgoCD admin credentials to admin/admin123 immediately after install
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-initial-admin-secret
        namespace: "{{ argocd.namespace }}"
      data:
        password: "{{ 'admin123' | b64encode }}"
        
- name: Create ArgoCD Ingress if not created by Helm
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-ingress
        namespace: "{{ argocd.namespace }}"
        annotations:
          nginx.ingress.kubernetes.io/ssl-passthrough: "false"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
          nginx.ingress.kubernetes.io/client-body-timeout: "60"
          nginx.ingress.kubernetes.io/client-max-body-size: "1m"
      spec:
        ingressClassName: nginx
        rules:
        - host: "argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: argocd-server
                  port:
                    number: 80
    
- name: Apply ArgoCD configuration fixes for wildcard compatibility
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: "{{ argocd.namespace }}"
      data:
        server.insecure: "true"
        server.basehref: "/"
        server.disable.auth: "false"
        server.rootpath: "/"
        server.enable.gzip: "false"
        server.staticassets: "false"
        
- name: Set ArgoCD main secret credentials to admin/admin123
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
        namespace: "{{ argocd.namespace }}"
      data:
        admin.password: "{{ 'admin123' | b64encode }}"
        admin.passwordMtime: "{{ '1735707600' | b64encode }}"
        
- name: Set ArgoCD initial admin secret credentials to admin/admin123
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-initial-admin-secret
        namespace: "{{ argocd.namespace }}"
      data:
        password: "{{ 'admin123' | b64encode }}"
        
- name: Update ArgoCD URL configuration for wildcard
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        namespace: "{{ argocd.namespace }}"
      data:
        url: "http://argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
        statusbadge.enabled: "false"
        timeout.hard.reconciliation: "0s"
        timeout.reconciliation: "180s"
    
- name: Get ArgoCD server service information
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: argocd-server
    namespace: "{{ argocd.namespace }}"
  register: argocd_service
  
# Git Repository Access Configuration
#
# DEVELOPMENT/PUBLIC REPOS: Uses HTTPS (current configuration)
#   - No SSH keys required
#   - Suitable for public repositories
#   - Simpler setup and more secure for public projects
#
# PRODUCTION/PRIVATE REPOS: Use SSH (manual configuration required)
#   - For private repositories that require SSH access
#   - Configure manually after bootstrap:
#     kubectl create secret generic git-ssh-key \
#       --from-file=ssh-privatekey=~/.ssh/id_ed25519 \
#       --from-file=ssh-publickey=~/.ssh/id_ed25519.pub \
#       -n argocd
#   - Then add label: kubectl label secret git-ssh-key argocd.argoproj.io/secret-type=repository -n argocd
#   - Update applications to use: repoURL: "git@github.com:user/repo.git"
  
# NGINX Ingress Controller is installed via dedicated nginx-ingress role
# This section only creates ArgoCD-specific ingress resources

# Create ArgoCD Ingress pointing to NGINX controller
- name: Create ArgoCD Ingress
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-ingress
        namespace: "{{ argocd.namespace }}"
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/ssl-passthrough: "false"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
          nginx.ingress.kubernetes.io/client-body-timeout: "60"
          nginx.ingress.kubernetes.io/client-max-body-size: "1m"
      spec:
        ingressClassName: nginx
        rules:
          - host: "argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
            http:
              paths:
                - path: /applications
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80

# Wait for ArgoCD Ingress to be configured
- name: Wait for ArgoCD Ingress to exist
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: argocd-ingress
    namespace: "{{ argocd.namespace }}"
    wait: true
    wait_timeout: 300

# Kubernetes Dashboard will be managed by ArgoCD as an application
  
- name: Display ArgoCD access information
  debug:
    msg:
      - "🚀 ArgoCD GitOps installed successfully!"
      - "👤 Username: admin"
      - "🔐 Password: admin123"
      - "🌐 Wildcard Access: https://argocd.{{ kubeadm.base_domain | default('apps.k8s.labjp.xyz') }}"
      - "📋 Architecture: HAProxy (SSL termination) → NGINX → ArgoCD"
      - "   NGINX Ingress Controller: HTTP NodePort 30080 only"
      - "   ArgoCD Service: ClusterIP (internal)"
      - "📝 pfSense HAProxy Configuration:"
      - "   Frontend: *.apps.k8s.labjp.xyz:443 (SSL termination)"
      - "   Backend: 10.0.10.100:30080 (HTTP only)"
      - "   ⚠️  Eliminar backend HTTPS - solo usar HTTP"
      - "💡 SSL Termination: HAProxy maneja SSL con wildcard cert"
      - "🔧 ArgoCD Ingress: Configurado para backend HTTP con headers"
      - "✅ Flujo: DNS → HAProxy (SSL termination) → HTTP (30080) → NGINX → ArgoCD"

- name: Restart ArgoCD deployment to apply configuration changes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: "{{ argocd.namespace }}"
      spec:
        template:
          metadata:
            annotations:
              configmap-restart: "{{ ansible_date_time.epoch }}"
    
- name: Wait for ArgoCD deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd.namespace }}"
    wait: true
    wait_sleep: 5
    wait_timeout: 300
    wait_condition:
      type: Progressing
      status: "True"
      reason: NewReplicaSetAvailable
    
- name: Wait for ArgoCD server pods to be ready
  kubernetes.core.k8s:
    kind: Deployment
    api_version: apps/v1
    name: argocd-server
    namespace: "{{ argocd.namespace }}"
    wait: true
    wait_sleep: 5
    wait_timeout: 300
    wait_condition:
      type: Available
      status: "True"

- name: Pause for ArgoCD to stabilize
  pause:
    seconds: 30
    
# Password configuration is now handled by the ArgoCD Helm chart
    
- name: Apply App-of-Apps pattern
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: app-of-apps
        namespace: "{{ argocd.namespace }}"
        labels:
          app.kubernetes.io/name: app-of-apps
          app.kubernetes.io/part-of: ebpf-ai-system
      spec:
        project: default
        source:
          repoURL: "{{ applications.ebpf_ai.git_repo }}"
          targetRevision: "{{ applications.ebpf_ai.git_branch }}"
          path: gitops/applications
        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ argocd.namespace }}"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
            allowEmpty: false
          syncOptions:
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
          retry:
            limit: 5
            backoff:
              duration: 5s
              factor: 2
              maxDuration: 3m
              
# All individual applications are defined in gitops/applications/
# They will be automatically created by the App-of-Apps pattern

- name: Wait for App-of-Apps to be created
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: app-of-apps
    namespace: "{{ argocd.namespace }}"
    wait: true
    wait_timeout: 60
  register: app_of_apps

- name: Pause to let ArgoCD process the App-of-Apps
  pause:
    seconds: 15

- name: Get list of all applications created by App-of-Apps
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argocd.namespace }}"
  register: all_apps

- name: Display GitOps setup status
  debug:
    msg:
      - "🚀 ArgoCD App-of-Apps configured successfully!"
      - "📦 Git Repository: {{ applications.ebpf_ai.git_repo }}"
      - "🌿 Branch: {{ applications.ebpf_ai.git_branch }}"
      - "🔄 Sync Policy: Automated (applications will auto-sync)"
      - "✅ Bootstrap complete! ArgoCD will manage all deployments"
