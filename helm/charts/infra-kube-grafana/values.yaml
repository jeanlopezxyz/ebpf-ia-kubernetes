# Grafana Configuration for eBPF-AI Platform

grafana:
  enabled: true
  
  # Basic configuration  
  # adminPassword: "admin123"  # REMOVED - now using sealed secret
  admin:
    existingSecret: "grafana-admin-secret"
    userKey: admin-user
    passwordKey: admin-password
  
  
  # Service configuration
  service:
    type: ClusterIP
    port: 3000
    
  # Persistence for dashboards and data
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: "local-path"
    
  # Enhanced plugins for eBPF-AI visualizations (compatible with Grafana v10+)
  plugins:
    - grafana-piechart-panel
    - grafana-worldmap-panel
    - grafana-polystat-panel
    
  # Datasource configuration
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://infra-kube-prometheus-server.prometheus.svc.cluster.local:80
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: "15s"
            queryTimeout: "60s"
            httpMethod: GET
            
  # Dashboard providers (not needed with sidecar)
  dashboardProviders: {}
          
  # Dashboards - will be loaded by sidecar from ConfigMaps
  dashboards: {}
        
  # Sidecar enabled for automatic ConfigMap detection
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: true
        name: eBPF-AI-Dashboards
        orgid: 1
        folder: 'eBPF-AI Security'
      
  # Grafana configuration
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
      serve_from_sub_path: false
    security:
      admin_user: admin
      # admin_password removed - using sealed secret
    users:
      auto_assign_org_role: Admin
    auth:
      disable_login_form: false
      disable_signout_menu: false
    security:
      login_maximum_inactive_lifetime_duration: 7d
      login_maximum_lifetime_duration: 30d
      login_cookie_name: grafana_sess
      login_remember_days: 7
    alerting:
      enabled: true
      execute_alerts: true
    smtp:
      enabled: false  # Configure if email alerts needed
    notifications:
      timeout: 30s
    panels:
      disable_sanitize_html: false
    security:
      disable_gravatar: true
      cookie_secure: false
      strict_transport_security: false
      
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Custom Ingress configuration (outside of grafana config)
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: grafana.apps.k8s.labjp.xyz
      paths:
        - path: /
          pathType: Prefix
          service:
            name: infra-kube-grafana
            port: 3000
  tls: []
