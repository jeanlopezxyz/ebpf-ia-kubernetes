# Grafana Configuration - Generic Kubernetes Chart

# Global configuration
global:
  domain: "example.com"  # Change to your domain (e.g., apps.k8s.mydomain.com)

# Admin credentials (creates secret automatically)
admin:
  existingSecret: "grafana-admin-secret"
  userKey: admin-user
  passwordKey: admin-password
  user: admin
  password: admin123

grafana:
  enabled: true
  
  # Basic configuration  
  # adminPassword: "admin123"  # REMOVED - now using sealed secret
  admin:
    existingSecret: "grafana-admin-secret"
    userKey: admin-user
    passwordKey: admin-password
  
  
  # Service configuration
  service:
    type: ClusterIP
    port: 3000
    
  # Persistence for dashboards and data
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""  # Use cluster default storage class
    
  # Enhanced plugins for eBPF-AI visualizations (compatible with Grafana v10+)
  plugins:
    - grafana-piechart-panel
    - grafana-worldmap-panel
    - grafana-polystat-panel
    
  # Datasource configuration
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local:80  # Change to your Prometheus service
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: "15s"
            queryTimeout: "60s"
            httpMethod: GET
            
  # Dashboard providers (not needed with sidecar)
  dashboardProviders: {}
          
  # Dashboards - will be loaded by sidecar from ConfigMaps
  dashboards: {}
        
  # Sidecar enabled for automatic ConfigMap detection
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: true
        name: eBPF-AI-Dashboards
        orgid: 1
        folder: 'eBPF-AI Security'
      
  # Grafana configuration
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
      serve_from_sub_path: false
    security:
      admin_user: admin
      # admin_password removed - using sealed secret
    users:
      auto_assign_org_role: Admin
    auth:
      disable_login_form: false
      disable_signout_menu: false
    security:
      login_maximum_inactive_lifetime_duration: 7d
      login_maximum_lifetime_duration: 30d
      login_cookie_name: grafana_sess
      login_remember_days: 7
    alerting:
      enabled: true
      execute_alerts: true
    smtp:
      enabled: false  # Configure if email alerts needed
    notifications:
      timeout: 30s
    panels:
      disable_sanitize_html: false
    security:
      disable_gravatar: true
      cookie_secure: false
      strict_transport_security: false
      
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Exposure configuration - choose Gateway API or Ingress
exposure:
  # Method: "gateway" for Gateway API, "ingress" for traditional Ingress
  method: "ingress"  # Change to "gateway" if your cluster supports Gateway API

# Gateway API configuration (when exposure.method = "gateway")
gateway:
  # Gateway reference (must exist in cluster)
  gatewayRef:
    name: "main-gateway"          # Change to your Gateway name
    namespace: "gateway-system"   # Change to your Gateway namespace
  
  # HTTPRoute configuration
  httpRoute:
    hostname: "grafana.{{ .Values.global.domain }}"
    path: "/"
    pathType: "PathPrefix"
    
    # Backend service (Grafana service name)
    backend:
      serviceName: "grafana"      # Official Grafana chart service name
      servicePort: 3000
      weight: 100

# Ingress configuration (when exposure.method = "ingress")
ingress:
  enabled: true  # Will be conditional in template
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: "grafana.{{ .Values.global.domain }}"  # Uses global domain
      paths:
        - path: /
          pathType: Prefix
          service:
            name: grafana  # Fixed: use actual service name
            port: 3000
  tls: []
