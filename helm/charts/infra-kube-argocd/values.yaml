# ArgoCD Configuration - Generic Kubernetes Chart

# Global configuration
global:
  domain: "example.com"  # Change to your domain (e.g., apps.k8s.mydomain.com)

argo-cd:
  configs:
    params:
      "server.insecure": "true" # HTTP mode for development
    cm:
      admin.enabled: "true"
      url: "http://argocd.{{ .Values.global.domain | default \"example.com\" }}" # External URL
    # secret:
    #   argocdServerAdminPassword: "REMOVED - using sealed secret"
    #   argocdServerAdminPasswordMtime: "2025-08-24T00:00:00Z"
    
    # Use sealed secret instead
    secretNames:
      argocdServerAdminPassword: "argocd-admin-secret"

  server:
    insecure: true
    service:
      type: "ClusterIP"  # ClusterIP with Ingress routing
    ingress:
      enabled: false # We use custom Ingress below
    extraArgs:
      - --insecure

  repoServer:
    env:
      - name: NO_PROXY
        value: "127.0.0.1,localhost,.svc,.cluster.local,kubernetes.default.svc"

# Exposure configuration - choose Gateway API or Ingress
exposure:
  # Method: "gateway" for Gateway API, "ingress" for traditional Ingress  
  method: "ingress"  # Change to "gateway" if your cluster supports Gateway API

# Gateway API configuration (when exposure.method = "gateway")
gateway:
  # Gateway reference (must exist in cluster)
  gatewayRef:
    name: "main-gateway"          # Change to your Gateway name
    namespace: "gateway-system"   # Change to your Gateway namespace
  
  # HTTPRoute configuration
  httpRoute:
    hostname: "argocd.{{ .Values.global.domain }}"
    path: "/"
    pathType: "PathPrefix"
    
    # Backend service (ArgoCD server)
    backend:
      serviceName: "argocd-server"  # ArgoCD service name
      servicePort: 80
      weight: 100

# Ingress configuration (when exposure.method = "ingress")
ingress:
  enabled: true  # Will be conditional in template
  className: nginx  # Change to your ingress class (nginx, traefik, etc.)
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-timeout: "60"
    nginx.ingress.kubernetes.io/client-max-body-size: "1m"
  hosts:
    - host: "argocd.{{ .Values.global.domain }}"  # Uses global domain
      paths:
        - path: /
          pathType: Prefix
          service:
            name: argocd-server
            port: 80
