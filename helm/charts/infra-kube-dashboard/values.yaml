# Kubernetes Dashboard Configuration - Generic Chart

# Global configuration  
global:
  domain: "example.com"  # Change to your domain (e.g., apps.k8s.mydomain.com)

kubernetes-dashboard:
  # App configuration
  app:
    # Security settings for development environment
    insecureLogin: true
    enableSkipLogin: true
    mode: dashboard
    
  # Service configuration
  service:
    type: ClusterIP
    
  # Settings
  settings:
    clusterName: "ebpf-kvm-cluster"
    itemsPerPage: 20
    
  # Enable metrics server for resource monitoring
  metricsScraper:
    enabled: true
    
  # Security context (non-root for security)
  securityContext:
    runAsUser: 1001
    runAsGroup: 2001
    runAsNonRoot: true
    
  # Optional: Custom certificate configuration for HTTPS
  # certificateSkipValidation: true

# ServiceAccount configuration for dashboard access
serviceAccount:
  # Create a ServiceAccount with admin permissions
  create: true
  name: "dashboard-admin"
  # Cluster role to bind (cluster-admin gives full access)
  clusterRole: "cluster-admin"
  # Token duration (optional, defaults to cluster default)
  tokenDuration: "8760h"  # 1 year

# Exposure configuration - choose Gateway API or Ingress
exposure:
  # Method: "gateway" for Gateway API, "ingress" for traditional Ingress
  method: "ingress"  # Change to "gateway" if your cluster supports Gateway API
  
# Gateway API configuration (when exposure.method = "gateway")
gateway:
  # Gateway reference (must exist in cluster)
  gatewayRef:
    name: "cilium-gateway"        # Cilium Gateway created by Ansible
    namespace: "gateway-system"
  
  # HTTPRoute configuration
  httpRoute:
    hostname: "dashboard.{{ .Values.global.domain }}"
    path: "/"
    pathType: "PathPrefix"
    
    # Backend service (Kubernetes Dashboard)
    backend:
      serviceName: "dashboard-kubernetes-dashboard-web"
      servicePort: 8000
      weight: 100

# Ingress configuration (when exposure.method = "ingress") 
ingress:
  enabled: true  # Will be conditional in template
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: dashboard.apps.k8s.labjp.xyz
      paths:
        - path: /
          pathType: Prefix
          service:
            name: kubernetes-dashboard-kong-proxy
            port: 443