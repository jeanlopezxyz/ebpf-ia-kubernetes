{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccount.name }}-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccount.clusterRole }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
---
{{- if .Values.serviceAccount.tokenDuration }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccount.name }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: token
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccount.name }}
    kubernetes.io/service-account.uid: ""
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}