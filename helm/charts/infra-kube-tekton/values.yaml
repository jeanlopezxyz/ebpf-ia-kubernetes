# Tekton Complete Platform Configuration

# Global configuration
global:
  namespace: tekton
  domain: "example.com"  # Change to your domain

# Enable/disable components
dashboard:
  enabled: true
  
pipelines:
  enabled: true
  
triggers:
  enabled: true

# External configurations that will be used by upstream installers
tektonConfig:
  # These will point to official Tekton releases
  pipelinesVersion: "v0.62.0"
  dashboardVersion: "v0.60.0"
  triggersVersion: "v0.28.1"
  
  # Generic configurations (update for your environment)
  registry:
    url: "registry.{{ .Values.global.domain }}"
    internal_url: "registry.registry.svc.cluster.local:5000"
  
  git:
    repository: "https://github.com/your-org/your-repo.git"  # Change to your repository
    branch: "main"
  
  webhook:
    host: "tekton-webhook.{{ .Values.global.domain }}"
    
  dashboard:
    host: "tekton-dashboard.{{ .Values.global.domain }}"