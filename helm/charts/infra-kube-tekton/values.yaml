# Tekton Complete Platform Configuration

# Global configuration
global:
  namespace: tekton-pipelines
  domain: "apps.k8s.labjp.xyz"  # Change to your domain

# Enable/disable components
dashboard:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  image:
    repository: ghcr.io/tektoncd/dashboard
    tag: "v0.62.0"
    pullPolicy: IfNotPresent
  ingressClassName: nginx
  config:
    logLevel: info
    logFormat: text
    pipelinesNamespace: "tekton-pipelines"
    triggersNamespace: "tekton-pipelines"
    readOnly: false
    logoutUrl: ""
    namespaces: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
pipelines:
  enabled: true
  
triggers:
  enabled: true

# External configurations that will be used by upstream installers
tektonConfig:
  # These will point to official Tekton releases (latest versions)
  pipelinesVersion: "v1.5.0"
  dashboardVersion: "v0.62.0" 
  triggersVersion: "v0.33.0"
  
  # Generic configurations (update for your environment)
  registry:
    url: "registry.{{ .Values.global.domain }}"
    internal_url: "registry.registry.svc.cluster.local:5000"
  
  git:
    repository: "https://github.com/jeanlopezxyz/ebpf-ia-kubernetes.git"  # eBPF-AI repository
    branch: "main"
  
  webhook:
    host: "tekton-webhook.{{ .Values.global.domain }}"
    
  dashboard:
    host: "tekton-dashboard.{{ .Values.global.domain }}"