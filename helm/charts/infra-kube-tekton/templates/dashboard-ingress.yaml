{{- if and .Values.dashboard.enabled .Values.tektonConfig.dashboard.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-dashboard-ingress
  namespace: {{ include "tekton.namespace" . }}
  labels:
    app.kubernetes.io/name: tekton-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: ebpf-ai-platform
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-timeout: "60"
    nginx.ingress.kubernetes.io/client-max-body-size: "1m"
spec:
  {{- if .Values.dashboard.ingressClassName }}
  ingressClassName: {{ .Values.dashboard.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.tektonConfig.dashboard.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tekton.dashboard.fullname" . }}
                port:
                  number: 9097
  {{- if .Values.dashboard.tls }}
  tls:
    {{- range .Values.dashboard.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}