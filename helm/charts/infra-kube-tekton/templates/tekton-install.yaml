{{- if .Values.pipelines.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "tekton.namespace" . }}
---
# This will install Tekton Pipelines using official manifests
apiVersion: batch/v1
kind: Job
metadata:
  name: tekton-pipelines-install
  namespace: {{ include "tekton.namespace" . }}
  labels:
    {{- include "tekton.labels" . | nindent 4 }}
    app.kubernetes.io/component: installer
spec:
  template:
    spec:
      serviceAccountName: tekton-installer
      restartPolicy: OnFailure
      containers:
      - name: installer
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "🚀 Installing Tekton Pipelines v{{ .Values.tektonConfig.pipelinesVersion }}"
          kubectl apply --filename https://storage.googleapis.com/tekton-releases/pipeline/{{ .Values.tektonConfig.pipelinesVersion }}/release.yaml
          
          {{- if .Values.dashboard.enabled }}
          echo "🎯 Installing Tekton Dashboard v{{ .Values.tektonConfig.dashboardVersion }}"
          kubectl apply --filename https://storage.googleapis.com/tekton-releases/dashboard/{{ .Values.tektonConfig.dashboardVersion }}/tekton-dashboard-release.yaml
          {{- end }}
          
          {{- if .Values.triggers.enabled }}
          echo "🔧 Installing Tekton Triggers v{{ .Values.tektonConfig.triggersVersion }}"
          kubectl apply --filename https://storage.googleapis.com/tekton-releases/triggers/{{ .Values.tektonConfig.triggersVersion }}/release.yaml
          {{- end }}
          
          echo "✅ Tekton installation completed"
          echo "📋 Verifying installation..."
          kubectl get pods -n {{ include "tekton.namespace" . }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-installer
  namespace: {{ include "tekton.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: tekton-installer
  namespace: {{ include "tekton.namespace" . }}