{{- if eq .Values.exposure.method "gateway" }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: kubesphere-httproute
  namespace: kubesphere-system
  labels:
    app.kubernetes.io/name: kubesphere
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: ebpf-ai-platform
    app.kubernetes.io/component: gateway
spec:
  parentRefs:
  - name: {{ .Values.gateway.gatewayRef.name }}
    namespace: {{ .Values.gateway.gatewayRef.namespace }}
  hostnames:
  - {{ .Values.gateway.httpRoute.hostname | quote }}
  rules:
  - matches:
    - path:
        type: {{ .Values.gateway.httpRoute.pathType }}
        value: {{ .Values.gateway.httpRoute.path }}
    backendRefs:
    - name: {{ .Values.gateway.httpRoute.backend.serviceName }}
      port: {{ .Values.gateway.httpRoute.backend.servicePort }}
      weight: {{ .Values.gateway.httpRoute.backend.weight }}
{{- end }}